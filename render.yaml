databases:
  - name: agendafacil-db
    plan: free
    databaseName: agendafacil_backend_production
    user: agendafacil_backend

services:
  - type: web
    name: agendafacil-backend
    runtime: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bin/rails db:prepare && bin/rails server"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: agendafacil-db
          property: connectionString
